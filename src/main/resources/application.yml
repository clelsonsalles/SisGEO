server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: sisgos-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/sisgos_db}
    username: ${SPRING_DATASOURCE_USERNAME:sisgos_user}
    password: ${SPRING_DATASOURCE_PASSWORD:sisgos_secret_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      pool-name: SisgosHikariCP

  jpa:
    database: postgresql
    database-platform: ${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.PostgreSQLDialect}
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 25

  # Configuração para servir o frontend React SPA a partir de static/
  web:
    resources:
      static-locations: classpath:/static/,classpath:/public/

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
